      <tspan x="0" y="0">Engineering trust</tspan>
      <tspan x="0" y="92">between humans &amp;</tspan>
      <tspan x="0" y="184" font-style="italic" font-weight="400">intelligent</tspan>
      <tspan font-style="normal" font-weight="700"> machines.</tspan>
    </text>
  </g>

  <!-- Footer meta -->
  <g transform="translate(72, 540)">
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#e6e6e6" stroke-width="1"/>
    <text x="0" y="38"
          font-family="Roboto, sans-serif"
          font-size="20"
          font-weight="500"
          fill="#0a0a0a">Rafa Ghassan Rasyidi</text>
    <text x="0" y="62"
          font-family="JetBrains Mono, monospace"
          font-size="13"
          letter-spacing="1.5"
          fill="#6b6b6b">AI TRAINER · RLHF SPECIALIST · INDONESIAN LANGUAGE EXPERT</text>

    <text x="1056" y="38"
          font-family="JetBrains Mono, monospace"
          font-size="13"
          letter-spacing="1.5"
          fill="#6b6b6b"
          text-anchor="end">BANDUNG, INDONESIA</text>
    <text x="1056" y="62"
          font-family="Roboto, sans-serif"
          font-size="14"
          font-weight="500"
          fill="#0a0a0a"
          text-anchor="end">rafaghassanr@gmail.com</text>
