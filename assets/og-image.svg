<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6e6e6" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Brand mark -->
  <g transform="translate(72, 72)">
    <text x="0" y="20"
          font-family="Montserrat, sans-serif"
          font-size="20"
          font-weight="700"
          letter-spacing="-0.5"
          fill="#0a0a0a">RAFA GHASSAN</text>
    <text x="180" y="20"
          font-family="JetBrains Mono, monospace"
          font-size="14"
          font-weight="500"
          letter-spacing="2"
          fill="#6b6b6b">/ AI</text>
  </g>

  <!-- Status dot -->
  <g transform="translate(72, 130)">
    <circle cx="6" cy="6" r="6" fill="#16a34a" opacity="0.2"/>
    <circle cx="6" cy="6" r="3.5" fill="#16a34a"/>
    <text x="22" y="11"
          font-family="JetBrains Mono, monospace"
          font-size="13"
