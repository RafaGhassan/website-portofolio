<!DOCTYPE html>
<!--
  ============================================================
  OG IMAGE PREVIEW — Use this to generate og-image.png
  ============================================================
  How to convert the SVG OG image to a PNG that LinkedIn / WhatsApp /
  Twitter will reliably display:

  Option A (easiest): Open this file in a browser, then take a
    screenshot of just the box (use a clean tool like macOS
    Cmd+Shift+5 or Windows Snipping Tool, crop to 1200x630).
    Save as `og-image.png` in this folder.

  Option B: Open assets/og-image.svg in any free online converter
    (e.g. cloudconvert.com/svg-to-png), set size to 1200x630, download
    as `og-image.png`, and put in this folder.

  Option C: If you use VS Code or have Inkscape installed, you can
    export og-image.svg to PNG at 1200x630 directly.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Image Preview — 1200x630</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f4f4f4; }
  .info { max-width: 1200px; margin: 0 auto 16px; font-size: 14px; color: #444; }
  .frame {
    width: 1200px; height: 630px;
    margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    background: white;
    overflow: hidden;
  }
  .frame img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <p class="info">
    Below is a 1200×630 preview of your social-share image. Take a screenshot of the
    white box (exact pixel dimensions) and save as <code>og-image.png</code> in the
    <code>assets/</code> folder.
  </p>
  <div class="frame">
    <img src="og-image.svg" alt="OG image preview" />
  </div>
</body>
</html>
